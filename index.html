//variaveis canvas

var dA, dB, d11, d12, d21, d22, d31, d32, d41, d42, d51, d52, insereProblem,

var pos = {

//variaveis grafico e caixas
var X = -50, Y = 7, altCel = 15, largCel = 46, len, len1, 
len2, len3, len4, len5, lens, len1s, len2s, len3s, len4s, len5s,
i = 0, corMarcaP = "#dFdFdF", corMarca = "#FFF", corMarca0P = "#dFdFdF", corMarca0 = "#FFF", 
corMarca1P = "#ad0100", corMarca1 = "#ff0200", corMarca2P = "#c2bb00", corMarca2 = "#fff500",

//variaveis andamentos

//funções	

function reconfigura() {
	
	i = 0;
	X = -50;
	Y = 7;
	criadoAnd = 0;
		
	caixas = {
	_cx: []
	};
	
	aList = {
	_list: []	
	};
	
};  
	  
function criarCaixas() {
		  	 
	for (i=0;i<=criadoAnd;i++) {
	 	
	// posiciona as caixas em espiral
			
		if (i <= 16) {			
			
			X = X + ((largCel + 4) + 6); 	 	
				
		} else if (i > 16 && i <= 22){
			
			Y = Y + ((((altCel+2)*5)+2) + 6);
			
		} else if (i > 22 && i <= 38){
			
			X = X - ((largCel + 4) + 6);
			
		} else if (i > 38 && i <= 42){
			
			Y = Y - ((((altCel+2)*5)+2) + 6);
			
		} else if (i > 42 && i <= 56){
			
			X = X + ((largCel + 4) + 6);
			
		} else if (i > 56 && i <= 58){
			
			Y = Y + ((((altCel+2)*5)+2) + 6);
			
		} else if (i > 58 && i <= 72){
			
			X = X - ((largCel + 4) + 6);
			
		};
	
		
		caixas._cx[i] = {
			 
		fundo: {	 	
	 		x: X,
			y: Y,
			altura: ((altCel+2)*5)+2,
			largura: largCel + 4,
			cor: "#5b5d51"

	 	andP: {
			x: X + 2,
			y: Y + 2,

	 	and2: {

			largura: largCel,
			cor: "#FFF",
			valor: 41

	 	and3: {
			x: X + 2,
			y: Y  + 2 + ((altCel + 2) * 3),

			cor: "#FFF",
			valor: 47.5

	 	and4: {

			largura: largCel,
			cor: "#FFF",
			valor: 66
			},	
	
		};
	
	};

};
	
function andamentos() {
	
	aList._list[0] = {
		
		aP : andamentoP,
		a1 : andamentoP * (andamentoS11/andamentoS12),
		a2 : andamentoP * (andamentoS21/andamentoS22),
		a3 : andamentoP * (andamentoS31/andamentoS32),
		a4 : andamentoP * (andamentoS41/andamentoS42)
	
	};
	
	for (j=0;j<500;j++) {
		
		criadoAnd++;
		
		aList._list[criadoAnd] = {
		
			aP : aList._list[j].a1,
			a1 : aList._list[j].a1 * (andamentoS11/andamentoS12),
			a2 : aList._list[j].a1 * (andamentoS21/andamentoS22),
			a3 : aList._list[j].a1 * (andamentoS31/andamentoS32),
			a4 : aList._list[j].a1 * (andamentoS41/andamentoS42)
		
		};
		
		criadoAnd++;
		
		aList._list[criadoAnd] = {
		
			aP : aList._list[j].a2,
			a1 : aList._list[j].a2 * (andamentoS11/andamentoS12),
			a2 : aList._list[j].a2 * (andamentoS21/andamentoS22),
			a3 : aList._list[j].a2 * (andamentoS31/andamentoS32),
			a4 : aList._list[j].a2 * (andamentoS41/andamentoS42)
		
		};
		
		criadoAnd++;
		
		aList._list[criadoAnd] = {
		
			aP : aList._list[j].a3,
			a1 : aList._list[j].a3 * (andamentoS11/andamentoS12),
			a2 : aList._list[j].a3 * (andamentoS21/andamentoS22),
			a3 : aList._list[j].a3 * (andamentoS31/andamentoS32),
			a4 : aList._list[j].a3 * (andamentoS41/andamentoS42)
		
		};
		
		criadoAnd++;
		
		aList._list[criadoAnd] = {
		
			aP : aList._list[j].a4,
			a1 : aList._list[j].a4 * (andamentoS11/andamentoS12),
			a2 : aList._list[j].a4 * (andamentoS21/andamentoS22),
			a3 : aList._list[j].a4 * (andamentoS31/andamentoS32),
			a4 : aList._list[j].a4 * (andamentoS41/andamentoS42)
		
		};
		
	};
	
	
	
};			

function excluiIguais() {
	
	for (i=1;i<=criadoAnd;i++) {
	
		for (j=0;j<i;j++) {
			
							
			if (Math.abs((aList._list[i].aP - aList._list[j].aP)) <= andamentoDif || aList._list[i].aP > andMax || aList._list[i].aP < andMin || i >= qtdAnd) {
				
				aList._list.splice(i, 1);
				
				i--;
				
				criadoAnd--;
				
				j = i;
				
			};
			
		};
	
	};
	
	totalAnd = aList._list.length - 1;	
	
};

function ordenar() {
	
	     
    for (i=0;i<totalAnd;i++) {
    	
    troca[1] = aList._list[i];
    troca[2] = aList._list[i+1];
    
    var a = aList._list[i].aP;
    var b = aList._list[i+1].aP;
    
    
    if (a > b) {
		
    aList._list.splice(i, 2, troca[2], troca[1]);
        
    i = -1;
    
    };
    
  };
  	
};
	
function valores() {
	
	for (i=0;i<=criadoAnd;i++) {	
		
	caixas._cx[i].andP.valor = aList._list[i].aP.toFixed(2);
	caixas._cx[i].and1.valor = aList._list[i].a1.toFixed(2);
	caixas._cx[i].and2.valor = aList._list[i].a2.toFixed(2);
	caixas._cx[i].and3.valor = aList._list[i].a3.toFixed(2);
	caixas._cx[i].and4.valor = aList._list[i].a4.toFixed(2);
			
	};
	
};

	
function desenha() {
		
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.font = "10px Arial";
		
	for (i=0;i<=criadoAnd;i++) {		
		
		ctx.fillStyle = caixas._cx[i].fundo.cor;
		ctx.fillRect(caixas._cx[i].fundo.x, caixas._cx[i].fundo.y, caixas._cx[i].fundo.largura, caixas._cx[i].fundo.altura);
		ctx.fillStyle = caixas._cx[i].andP.cor;
		ctx.fillRect(caixas._cx[i].andP.x, caixas._cx[i].andP.y, caixas._cx[i].andP.largura, caixas._cx[i].andP.altura);
		ctx.fillStyle = caixas._cx[i].and1.cor;
		ctx.fillRect(caixas._cx[i].and1.x, caixas._cx[i].and1.y, caixas._cx[i].and1.largura, caixas._cx[i].and1.altura);

		ctx.fillRect(caixas._cx[i].and2.x, caixas._cx[i].and2.y, caixas._cx[i].and2.largura, caixas._cx[i].and2.altura);

		ctx.fillRect(caixas._cx[i].and3.x, caixas._cx[i].and3.y, caixas._cx[i].and3.largura, caixas._cx[i].and3.altura);
		ctx.fillStyle = caixas._cx[i].and4.cor;
		ctx.fillRect(caixas._cx[i].and4.x, caixas._cx[i].and4.y, caixas._cx[i].and4.largura, caixas._cx[i].and4.altura);
				
		ctx.fillStyle = "#000";
		lens = caixas._cx[i].andP.valor.toString();
		len = lens.length;
		ctx.fillText(lens, (caixas._cx[i].andP.x + (caixas._cx[i].andP.largura / 2)) - ((len*6)/2), caixas._cx[i].andP.y + (altCel*0.7));
		len1s = caixas._cx[i].and1.valor.toString();
		len1 = len1s.length;
		ctx.fillText(len1s, (caixas._cx[i].and1.x + (caixas._cx[i].and1.largura / 2)) - ((len1*6)/2), caixas._cx[i].and1.y + (altCel*0.7));
		len2s = caixas._cx[i].and2.valor.toString();
		len2 = len2s.length;
		ctx.fillText(len2s, (caixas._cx[i].and2.x + (caixas._cx[i].and2.largura / 2)) - ((len2*6)/2), caixas._cx[i].and2.y + (altCel*0.7));
		len3s = caixas._cx[i].and3.valor.toString();
		len3 = len3s.length;
		ctx.fillText(len3s, (caixas._cx[i].and3.x + (caixas._cx[i].and3.largura / 2)) - ((len3*6)/2), caixas._cx[i].and3.y + (altCel*0.7));
		len4s = caixas._cx[i].and4.valor.toString();

		ctx.fillText(len4s, (caixas._cx[i].and4.x + (caixas._cx[i].and4.largura / 2)) - ((len4*6)/2), caixas._cx[i].and4.y + (altCel*0.7));
		
		if (i >= qtdAnd-1) {
			i = criadoAnd;
		};	
	};

};


function marcar() {
	
	for (index=0;index<=totalAnd;index++) {	
	
	// detecta clique
	
	var clicadoP =	pos.x > caixas._cx[index].andP.x && pos.x < (caixas._cx[index].andP.x + caixas._cx[index].andP.largura)

	var clicado3 =	pos.x > caixas._cx[index].and3.x && pos.x < (caixas._cx[index].and3.x + caixas._cx[index].and3.largura)

	var clicado4 =	pos.x > caixas._cx[index].and4.x && pos.x < (caixas._cx[index].and4.x + caixas._cx[index].and4.largura)

	// marca andamento clicado
	
	if (clicadoP) {
		
		if (!botaoAnd1) {
		displayAnd1 = caixas._cx[index].andP.valor;
		};
		if (!botaoAnd2) {
		displayAnd2 = caixas._cx[index].andP.valor;
		};
				
			for (i=0;i<=totalAnd;i++) {
				
				for (j=0; j<5;j++) {
					switch(j) {
						case 0: multiplo = 0.25;
							break;
						case 1: multiplo = 0.5;
							break;
						case 2: multiplo = 1;
							break;
						case 3: multiplo = 2;
							break;
						case 4: multiplo = 4;
							break;
					};
				
				if (!botao3Clic) {
					if (Math.abs((caixas._cx[index].andP.valor * multiplo) - caixas._cx[i].andP.valor) <= andamentoDif) {
						if (caixas._cx[i].andP.cor == corMarca0P) { caixas._cx[i].andP.cor = corMarca1P } else 
						if (caixas._cx[i].andP.cor == corMarca1P) { caixas._cx[i].andP.cor = corMarca0P } else					
						if (caixas._cx[i].andP.cor == corMarca2P) { caixas._cx[i].andP.cor = corMarca3P } else	
						if (caixas._cx[i].andP.cor == corMarca3P) { caixas._cx[i].andP.cor = corMarca2P };
					};
					if (Math.abs((caixas._cx[index].andP.valor * multiplo) - caixas._cx[i].and1.valor) <= andamentoDif) {
						if (caixas._cx[i].and1.cor == corMarca0) { caixas._cx[i].and1.cor = corMarca1 } else

					if (Math.abs((caixas._cx[index].andP.valor * multiplo) - caixas._cx[i].and2.valor) <= andamentoDif) {

						if (caixas._cx[i].and3.cor == corMarca3) { caixas._cx[i].and3.cor = corMarca2 };

						if (caixas._cx[i].and4.cor == corMarca0) { caixas._cx[i].and4.cor = corMarca1 } else 
						if (caixas._cx[i].and4.cor == corMarca1) { caixas._cx[i].and4.cor = corMarca0 } else					
						if (caixas._cx[i].and4.cor == corMarca2) { caixas._cx[i].and4.cor = corMarca3 } else	
						if (caixas._cx[i].and4.cor == corMarca3) { caixas._cx[i].and4.cor = corMarca2 };	
					};
				};
				
				if (!botao4Clic) {

						if (caixas._cx[i].andP.cor == corMarca0P) { caixas._cx[i].andP.cor = corMarca2P } else

						if (caixas._cx[i].and1.cor == corMarca2) { caixas._cx[i].and1.cor = corMarca0 } else

					};
					if (Math.abs((caixas._cx[index].andP.valor * multiplo) - caixas._cx[i].and2.valor) <= andamentoDif) {
						if (caixas._cx[i].and2.cor == corMarca0) { caixas._cx[i].and2.cor = corMarca2 } else 
						if (caixas._cx[i].and2.cor == corMarca1) { caixas._cx[i].and2.cor = corMarca3 } else					
						if (caixas._cx[i].and2.cor == corMarca2) { caixas._cx[i].and2.cor = corMarca0 } else	
						if (caixas._cx[i].and2.cor == corMarca3) { caixas._cx[i].and2.cor = corMarca1 };	
					};

function play() {

			metro1 = setInterval(function() {
				audio1.play();
				} ,(60000/displayAnd1));
							
			metro2 = setInterval(function() {
				audio2.play();	
			} ,(60000/displayAnd2));
		
		} else if (botaoAnd1 == true && botaoAnd2 == false && displayAnd2 > 1) {
		
			metro2 = setInterval(function() {
				audio2.play();	
			} ,(60000/displayAnd2));
			
		} else if (botaoAnd1 == false && botaoAnd2 == true && displayAnd1 > 1) {

			} ,(60000/displayAnd1));

function isKeyPressed(event) {
	
    if (event.shiftKey) {
        teclaShift = true;
        teclaCtrl = false;
    } else if (event.ctrlKey) {
        teclaCtrl = true;
        teclaShift = false;
    } else {
        teclaShift = false;
        teclaCtrl = false;
    };
    
}

function salvarPresets(preset) {
	
		var nomeBt = "btPreset" + preset;	
			
		if (teclaShift) { // se shift+click botãoPreset, salva dados do preset na variável presetArray
	
		document.getElementById(nomeBt).style.backgroundColor = "#e8f036";
		
		presetArray[preset] = [];
		
		presetArray[preset][0] = preset; 
		presetArray[preset][1] = document.getElementById("displayA").value;
		presetArray[preset][2] = document.getElementById("displayB").value;
		presetArray[preset][3] = document.getElementById("display1.1").value;
		presetArray[preset][4] = document.getElementById("display1.2").value;
		presetArray[preset][5] = document.getElementById("display2.1").value;
		presetArray[preset][6] = document.getElementById("display2.2").value;
		presetArray[preset][7] = document.getElementById("display3.1").value;
		presetArray[preset][8] = document.getElementById("display3.2").value;
		presetArray[preset][9] = document.getElementById("display4.1").value;
		presetArray[preset][10] = document.getElementById("display4.2").value;
				
		} else if (teclaCtrl) {
			
			if (presetArray[preset]) {			
				presetArray.splice(preset, 1, ""); 
				};
				
				document.getElementById(nomeBt).style.backgroundColor = "#b1bcb5";
			
			};
		
		
		if (presetArray[preset] && !teclaCtrl && !teclaShift) { // se existe um preset salvo, para o botão clicado, mostra os dados na tabela
			
			mostraDados(preset);

			};
		
		if (!presetArray[preset] && !teclaCtrl && !teclaShift) {
			
			alert("Preset vazio ou não salvo!\nSalve os presets atuais e/ou\nabra um arquivo válido de presets.")
			
			};
};

function salvarArquivo() {
	
	
	// cria string com presets
     		
     	presetDados = ""; 
     		
     	for (i=1;i<=16;i++) { // loop para concatenar linhas da string de presets
			
			var presetStr = "";     		
			
			if (presetArray[i]) {     		
     		
     			for (j=0;j<=10;j++) {      // loop para concatenar elementos de cada preset em uma linha da string
     			
     				presetStr =  presetStr + presetArray[i][j].toString() + " ";   	
     			
        		};
        	
        presetDados = presetDados + presetStr + "\n";
        
        	};
         		
      };
	 	
	 	var blob = new Blob([presetDados], {type: "text/plain;charset=utf-8"});
		var nome = prompt("nome do arquivo");
		saveAs(blob, nome + ".and");
	
};

  function readSingleFile(evt) {
  console.log(evt)
    //Retrieve the first (and only!) File from the FileList object
    var f = evt.target.files[0]; 

    if (f) {
      var r = new FileReader();
      r.onload = function(e) { 
	      var contents = e.target.result;
         var setArray = contents.split("\n"); // separa presets
         setArray.splice(setArray.length-1, 1);
      
      for (i=0;i<setArray.length;i++) {
      	
      	setArray[i] = setArray[i].split(" "); // separa elementos
      	if ((setArray[i].length-1) == "") {
				
				  setArray[i].pop();    		
      		
      		}
      	
      	var indicePreset = setArray[i][0];
      	presetArray[indicePreset] = setArray[i];  
			
      	};
      
      // exclui presets com mesmo índice
        
      for (i=(setArray.length - 1);i>=1;i--) {
		
			for (j=(i-1);j>=0;j--) {
				
				indicePreset = setArray[i][0];
				
				var indice2Preset = setArray[j][0];
				var subtrai = presetArray[indicePreset][0] - presetArray[indice2Preset][0];
			
				if (subtrai == 0) {
				
					presetArray.splice(indice2Preset, 1); 
				
					i--;
				
					j = i - 1;
				
				};
			
			};
		};
		
		for (i=1;i<=16;i++) {  // apaga cores dos botões
			
			var nomeBt = "btPreset" + i;			
         document.getElementById(nomeBt).style.backgroundColor = "#a8a885";	
			
			};		
		
     	for (i=0;i<setArray.length;i++) {  //colore os botões com preset
     		
     		var nomeBt = "btPreset" + setArray[i][0];			
         document.getElementById(nomeBt).style.backgroundColor = "#a5b741";			
         			
     		};
     		
     	// cria string com presets
     		
     	presetDados = ""; 
     		
     	for (i=0;i<setArray.length;i++) { // loop para concatenar linhas da string de presets
			
			indicePreset = setArray[i][0];
			var presetStr = "";     		
     		
     		for (j=0;j<=10;j++) {      // loop para concatenar elementos de cada preset em uma linha da string
     			presetStr =  presetStr + presetArray[indicePreset][j].toString() + " ";   	
        	};
        	
         presetDados = presetDados + presetStr + "\n";
         		
         };
      
      }
      r.readAsText(f);
    } else { 
      alert("Falha ao ler arquivo");
    }
  }

  document.getElementById('fileinput').addEventListener('change', readSingleFile, false);
